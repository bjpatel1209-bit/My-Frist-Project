<!DOCTYPE html>
<html>
<head>
    <title>Request Blood</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="form-card">
    <h2>🚑 Blood Request</h2>
    <p>Emergency blood request form</p>

    <form action="request.php" method="post">
        <input type="text" name="patient" placeholder="Patient Name" required>

        <select name="blood" required>
            <option value="">Required Blood Group</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option>
            <option>O+</option><option>O-</option>
        </select>

        <input type="text" name="mobile" placeholder="Contact Number" required>
        <input type="text" name="city" placeholder="Hospital / City" required>

        <button type="submit">Submit Request</button>
    </form>

    <a href="main.html" class="back-link">← Back to Dashboard</a>
</div>

</body>
</html>
